# Infra de desenvolvimento local.
#
#   docker compose up -d --wait                  só o Postgres (a API roda no host com `go run ./cmd/api`)
#   docker compose --profile app up -d --build   Postgres + API (API_PORT, padrão 8080) + site (WEB_PORT, padrão 3000) em containers
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: golden
      POSTGRES_PASSWORD: golden
      POSTGRES_DB: golden_era
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golden -d golden_era"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://golden:golden@db:5432/golden_era?sslmode=disable
      MIGRATE_ON_START: "true"
      IMAGES_DIR: /data/images
      IMAGE_BASE_URL: http://localhost:${API_PORT:-8080}/images
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./.data/images:/data/images:ro

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      # O site chama a API de dentro da rede do compose; o navegador só carrega as imagens, pelo IMAGE_BASE_URL da API.
      API_URL: http://api:8080/v1
      # Em HTTP (desenvolvimento) o cookie `Secure` seria recusado; ligue com HTTPS em produção.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
