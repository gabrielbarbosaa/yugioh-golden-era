# Infra de desenvolvimento local. A API roda no host (`go run ./cmd/api`).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: golden
      POSTGRES_PASSWORD: golden
      POSTGRES_DB: golden_era
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golden -d golden_era"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
