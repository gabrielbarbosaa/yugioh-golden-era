# nginx. Salve em /etc/nginx/sites-available/novaera e ative (ln -s para sites-enabled), depois:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d novaera.gabrielbarbosadev.com.br      # emite o certificado e liga o HTTPS
# As portas são as de .env.production (API_PORT 18080, DUEL_PORT 18787, WEB_PORT 13000).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name novaera.gabrielbarbosadev.com.br;

    client_max_body_size 2m;

    # Cabeçalhos que o site (Next.js) e a API usam: host original, protocolo e IP do visitante.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API do app e imagens das cartas
    location /v1/ {
        proxy_pass http://127.0.0.1:18080;
    }
    location /images/ {
        proxy_pass http://127.0.0.1:18080;
        expires 30d;
    }

    # Servidor de duelo: ingressos e WebSocket (o prefixo /duel-server é removido)
    location = /duel-server {
        proxy_pass http://127.0.0.1:18787/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /duel-server/ {
        proxy_pass http://127.0.0.1:18787/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s; # partidas longas: não derrubar o WebSocket por inatividade
    }

    # Todo o resto é o site
    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
    }
}