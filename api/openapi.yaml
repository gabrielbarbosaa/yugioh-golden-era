openapi: 3.0.3
info:
  title: Yu-Gi-Oh! Golden Era API
  version: 0.1.0
  description: |
    API do **Golden Era**, um deck builder e marketplace de decks da era Duel Monsters
    (cartas do OCG lançadas até dezembro de 2003).

    Este arquivo é a **fonte única de verdade** do contrato (abordagem spec-first):
    o servidor Go e o cliente TypeScript do app são gerados a partir dele.

    > Projeto de fã, sem fins lucrativos e sem afiliação com a Konami.
    > Dados de cartas via [YGOPRODeck](https://ygoprodeck.com/api-guide/).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080/v1
    description: Desenvolvimento local
tags:
  - name: System
    description: Saúde e metadados do serviço
  - name: Auth
    description: Cadastro, login e renovação de sessão
  - name: Cards
    description: Catálogo de cartas da era Duel Monsters
  - name: Decks
    description: Criação, edição e marketplace de decks
  - name: Social
    description: Curtidas, comentários e seguidores
  - name: Profiles
    description: Perfis de usuário
  - name: Collection
    description: Coleção pessoal de cartas

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Verifica se o serviço está de pé
      security: []
      responses:
        '200':
          description: Serviço saudável
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Cria uma conta
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Autentica com e-mail e senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Troca um refresh token por um novo par de tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Novos tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoga o refresh token informado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sessão encerrada
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: Busca cartas com filtros
      description: |
        Retorna somente cartas dentro da janela da era configurada
        (por padrão, OCG até 31/12/2003). A paginação é por cursor.
      security: []
      parameters:
        - name: q
          in: query
          description: Texto a buscar no nome da carta
          schema: { type: string, maxLength: 100 }
        - name: type
          in: query
          description: Tipo da carta (ex. Effect Monster, Spell Card)
          schema: { type: string }
        - name: attribute
          in: query
          schema: { type: string, example: DARK }
        - name: race
          in: query
          description: Tipo de monstro ou subtipo de magia/armadilha
          schema: { type: string, example: Spellcaster }
        - name: level
          in: query
          schema: { type: integer, minimum: 1, maximum: 12 }
        - name: archetype
          in: query
          schema: { type: string }
        - name: ids
          in: query
          description: |
            Passcodes separados por vírgula (máx. 100). Devolve só essas cartas (as que não
            existem na era ficam de fora), útil para carregar as cartas de um deck de uma vez.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de cartas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'

  /cards/facets:
    get:
      tags: [Cards]
      operationId: getCardFacets
      summary: Valores disponíveis para filtrar o catálogo
      description: |
        Tipos, atributos, espécies e níveis que existem nas cartas da era, para montar os filtros de
        `GET /cards` (`type`, `attribute`, `race`, `level`). Os arquétipos ficam em `GET /archetypes`.
      security: []
      responses:
        '200':
          description: Valores de filtro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardFacets'

  /cards/{cardId}:
    get:
      tags: [Cards]
      operationId: getCard
      summary: Detalha uma carta
      security: []
      parameters:
        - name: cardId
          in: path
          required: true
          description: Passcode da carta
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Carta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/NotFound'

  /banlist:
    get:
      tags: [Cards]
      operationId: getBanlist
      summary: Lista de cartas proibidas, limitadas e semilimitadas da era
      description: |
        Cartas que não aparecem aqui podem ter até 3 cópias. O servidor aplica a lista ao criar,
        editar, importar e copiar decks (422 com a carta e o limite).
      security: []
      responses:
        '200':
          description: Lista vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Banlist'

  /archetypes:
    get:
      tags: [Cards]
      operationId: listArchetypes
      summary: Lista arquétipos presentes na era
      security: []
      responses:
        '200':
          description: Arquétipos
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /sets:
    get:
      tags: [Cards]
      operationId: listSets
      summary: Lista sets lançados na era
      security: []
      responses:
        '200':
          description: Sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardSet'

  /decks:
    get:
      tags: [Decks]
      operationId: listDecks
      summary: Marketplace de decks públicos
      security: []
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [popular, recent]
            default: popular
        - name: archetype
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Busca por nome do deck
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de decks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckPage'
    post:
      tags: [Decks]
      operationId: createDeck
      summary: Cria um deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckInput'
      responses:
        '201':
          description: Deck criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /decks/import:
    post:
      tags: [Decks]
      operationId: importDeck
      summary: Importa um deck no formato YDK
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Conteúdo de um arquivo .ydk
      responses:
        '201':
          description: Deck importado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /anime-decks:
    get:
      tags: [Decks]
      operationId: listAnimeDecks
      summary: Decks de personagens do anime (era Duel Monsters)
      description: |
        Listas aproximadas, montadas a partir do anime. Cartas do deck no anime que não existem no catálogo
        da era vêm em `missing`.
      security: []
      responses:
        '200':
          description: Decks disponíveis
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnimeDeck' }

  /anime-decks/{slug}/import:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
    post:
      tags: [Decks]
      operationId: importAnimeDeck
      summary: Copia um deck de personagem do anime para a conta como rascunho privado
      description: |
        Cria um deck privado do usuário. O servidor respeita a lista de proibidas/limitadas da era
        (reduz as cópias, ou omite a carta proibida) e o Extra Deck; o que foi ajustado ou não existe
        no catálogo é anotado na descrição do deck.
      responses:
        '201':
          description: Deck criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /decks/{deckId}:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    get:
      tags: [Decks]
      operationId: getDeck
      summary: Detalha um deck
      description: Decks privados só são visíveis ao dono.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Deck encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Decks]
      operationId: updateDeck
      summary: Substitui o conteúdo de um deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckInput'
      responses:
        '200':
          description: Deck atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Decks]
      operationId: deleteDeck
      summary: Remove um deck
      responses:
        '204':
          description: Deck removido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /decks/{deckId}/copy:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    post:
      tags: [Decks]
      operationId: copyDeck
      summary: Copia um deck público para a conta do usuário
      responses:
        '201':
          description: Cópia criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /decks/{deckId}/export:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    get:
      tags: [Decks]
      operationId: exportDeck
      summary: Exporta um deck no formato YDK
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Arquivo YDK
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /decks/{deckId}/like:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    put:
      tags: [Social]
      operationId: likeDeck
      summary: Curte um deck
      responses:
        '204':
          description: Curtida registrada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Social]
      operationId: unlikeDeck
      summary: Remove a curtida de um deck
      responses:
        '204':
          description: Curtida removida
        '401':
          $ref: '#/components/responses/Unauthorized'

  /decks/{deckId}/comments:
    parameters:
      - $ref: '#/components/parameters/DeckId'
    get:
      tags: [Social]
      operationId: listDeckComments
      summary: Lista comentários de um deck
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de comentários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Social]
      operationId: createDeckComment
      summary: Comenta em um deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: Comentário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me:
    get:
      tags: [Profiles]
      operationId: getMe
      summary: Retorna o perfil do usuário autenticado
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profiles]
      operationId: updateMe
      summary: Atualiza o perfil do usuário autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/decks:
    get:
      tags: [Decks]
      operationId: listMyDecks
      summary: Lista os decks do usuário autenticado (inclui privados)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de decks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/collection:
    get:
      tags: [Collection]
      operationId: getMyCollection
      summary: Retorna a coleção do usuário
      responses:
        '200':
          description: Itens da coleção
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Collection]
      operationId: replaceMyCollection
      summary: Substitui a coleção do usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CollectionItem'
      responses:
        '200':
          description: Coleção salva
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{username}:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [Profiles]
      operationId: getUser
      summary: Perfil público de um usuário
      security: []
      responses:
        '200':
          description: Perfil público
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{username}/decks:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [Decks]
      operationId: listUserDecks
      summary: Decks públicos de um usuário
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de decks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckPage'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{username}/follow:
    parameters:
      - $ref: '#/components/parameters/Username'
    put:
      tags: [Social]
      operationId: followUser
      summary: Segue um usuário
      responses:
        '204':
          description: Agora seguindo
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Social]
      operationId: unfollowUser
      summary: Deixa de seguir um usuário
      responses:
        '204':
          description: Deixou de seguir
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso JWT obtido em `/auth/login`.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco retornado em `nextCursor`
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    DeckId:
      name: deckId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_]{3,24}$'

  responses:
    Unauthorized:
      description: Credenciais ausentes ou inválidas
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Muitas tentativas seguidas; aguarde o tempo de `Retry-After`
      headers:
        Retry-After:
          description: Segundos até uma nova tentativa ser aceita
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Sem permissão para este recurso
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflito com o estado atual (ex. e-mail já cadastrado)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Dados inválidos ou deck fora das regras
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string, example: 0.1.0 }

    Problem:
      type: object
      description: Erro no formato RFC 7807
      required: [title, status]
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string, example: cards.main }
                  message: { type: string, example: A zona principal precisa ter entre 40 e 60 cartas }

    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email: { type: string, format: email }
        username:
          type: string
          pattern: '^[a-zA-Z0-9_]{3,24}$'
        password: { type: string, format: password, minLength: 8, maxLength: 72 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn:
          type: integer
          description: Validade do token de acesso, em segundos
          example: 900

    Card:
      type: object
      required: [id, name, type, desc, imageUrl, imageSmallUrl, maxCopies]
      properties:
        id:
          type: integer
          format: int64
          description: Passcode da carta
          example: 46986414
        name: { type: string, example: Dark Magician }
        type: { type: string, example: Normal Monster }
        frameType: { type: string, example: normal }
        desc: { type: string }
        atk: { type: integer, nullable: true }
        def: { type: integer, nullable: true }
        level: { type: integer, nullable: true }
        race: { type: string, nullable: true, example: Spellcaster }
        attribute: { type: string, nullable: true, example: DARK }
        archetype: { type: string, nullable: true }
        ocgDate:
          type: string
          format: date
          nullable: true
          description: Data original de lançamento no OCG
        tcgDate:
          type: string
          format: date
          nullable: true
          description: Data original de lançamento no TCG
        imageUrl: { type: string, format: uri }
        imageSmallUrl: { type: string, format: uri }
        maxCopies:
          type: integer
          minimum: 0
          maximum: 3
          description: |
            Máximo de cópias num deck pela lista de proibidas/limitadas da era (veja `GET /banlist`):
            0 = proibida, 1 = limitada, 2 = semilimitada, 3 = sem restrição.

    CardFacets:
      type: object
      required: [types, attributes, races, levels]
      properties:
        types:
          type: array
          items: { type: string }
          example: [Effect Monster, Spell Card, Trap Card]
        attributes:
          type: array
          items: { type: string }
          example: [DARK, LIGHT]
        races:
          type: array
          items: { type: string }
          example: [Spellcaster, Warrior]
        levels:
          type: array
          items: { type: integer, minimum: 1, maximum: 12 }

    BanlistEntry:
      type: object
      required: [cardId, name, maxCopies]
      properties:
        cardId: { type: integer, format: int64 }
        name: { type: string }
        maxCopies:
          type: integer
          minimum: 0
          maximum: 2
          description: 0 = proibida, 1 = limitada, 2 = semilimitada

    Banlist:
      type: object
      required: [name, format, effectiveFrom, source, cards]
      properties:
        name: { type: string, example: OCG - outubro de 2003 }
        format: { type: string, example: OCG }
        effectiveFrom: { type: string, format: date, description: Início da vigência da lista }
        source: { type: string }
        cards:
          type: array
          items: { $ref: '#/components/schemas/BanlistEntry' }

    CardPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Card' }
        nextCursor: { type: string, nullable: true }

    CardSet:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: LOB }
        name: { type: string, example: Legend of Blue Eyes White Dragon }
        ocgDate: { type: string, format: date, nullable: true }
        tcgDate: { type: string, format: date, nullable: true }
        numOfCards: { type: integer }

    DeckZone:
      type: string
      enum: [main, extra, side]

    DeckCardEntry:
      type: object
      required: [cardId, quantity]
      properties:
        cardId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1, maximum: 3 }

    DeckCards:
      type: object
      required: [main, extra, side]
      properties:
        main:
          type: array
          items: { $ref: '#/components/schemas/DeckCardEntry' }
        extra:
          type: array
          items: { $ref: '#/components/schemas/DeckCardEntry' }
        side:
          type: array
          items: { $ref: '#/components/schemas/DeckCardEntry' }

    DeckStats:
      type: object
      properties:
        monsters: { type: integer }
        spells: { type: integer }
        traps: { type: integer }
        averageLevel: { type: number, format: float }

    DeckVisibility:
      type: string
      enum: [private, public]

    DeckInput:
      type: object
      required: [name, visibility, cards]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 2000 }
        archetype: { type: string, nullable: true }
        visibility: { $ref: '#/components/schemas/DeckVisibility' }
        cards: { $ref: '#/components/schemas/DeckCards' }

    AnimeDeck:
      type: object
      required: [slug, character, series, description, coverCardId, cardCount, missing]
      properties:
        slug: { type: string }
        character: { type: string }
        series: { type: string }
        description: { type: string }
        coverCardId: { type: integer, format: int64 }
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        cardCount:
          type: integer
          description: Cópias de cartas encontradas no catálogo da era
        missing:
          type: array
          description: Cartas do deck no anime que não existem no catálogo da era
          items: { type: string }

    DeckSummary:
      type: object
      required: [id, name, visibility, owner, likeCount, commentCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        archetype: { type: string, nullable: true }
        visibility: { $ref: '#/components/schemas/DeckVisibility' }
        owner: { $ref: '#/components/schemas/UserSummary' }
        coverCardId:
          type: integer
          format: int64
          nullable: true
        coverImageUrl:
          type: string
          format: uri
          nullable: true
          description: Imagem pequena da carta de capa (nula se o deck está vazio)
        likeCount: { type: integer }
        commentCount: { type: integer }
        likedByMe: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Deck:
      allOf:
        - $ref: '#/components/schemas/DeckSummary'
        - type: object
          required: [description, cards, stats]
          properties:
            description: { type: string }
            cards: { $ref: '#/components/schemas/DeckCards' }
            stats: { $ref: '#/components/schemas/DeckStats' }

    DeckPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeckSummary' }
        nextCursor: { type: string, nullable: true }

    UserSummary:
      type: object
      required: [id, username]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        avatarCardId:
          type: integer
          format: int64
          nullable: true
          description: Carta escolhida como foto de perfil (nula se não escolheu)
        avatarUrl:
          type: string
          format: uri
          nullable: true
          description: Imagem pequena da carta da foto de perfil (nula se não escolheu)

    Profile:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            bio: { type: string }
            deckCount: { type: integer }
            followerCount: { type: integer }
            followingCount: { type: integer }
            followedByMe: { type: boolean }
            createdAt: { type: string, format: date-time }

    ProfileUpdate:
      type: object
      properties:
        bio: { type: string, maxLength: 280 }
        avatarCardId:
          type: integer
          format: int64
          minimum: 0
          description: Carta da foto de perfil (id da carta no catálogo). 0 remove a foto.

    Comment:
      type: object
      required: [id, author, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/UserSummary' }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }

    CommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        nextCursor: { type: string, nullable: true }

    CollectionItem:
      type: object
      required: [cardId, quantity]
      properties:
        cardId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 0 }

security:
  - bearerAuth: []
